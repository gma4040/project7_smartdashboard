<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<rect width="700" height="450" fill="#f4f6f8"/>
<text x="20" y="30" font-size="16" fill="#333">Screen 5 — De-identified wall/export mode toggle (FR-10)</text>
<rect x="20" y="50" width="660" height="50" fill="#16324f"/>
<text x="35" y="80" font-size="14" fill="#fff">Wall Display Mode</text>
<rect x="540" y="62" width="120" height="26" fill="#2d7dd2" rx="13"/>
<text x="600" y="80" font-size="10" fill="#fff" text-anchor="middle">De-identified: ON</text>
<rect x="20" y="115" width="200" height="130" fill="#fff" stroke="#999" rx="6"/>
<text x="35" y="140" font-size="11" fill="#333">ICU census</text>
<text x="35" y="180" font-size="26" fill="#16324f">9 / 12</text>
<text x="35" y="200" font-size="9" fill="#888">beds occupied</text>
<text x="35" y="225" font-size="9" fill="#aaa">no patient identifiers shown</text>
<rect x="240" y="115" width="200" height="130" fill="#fff" stroke="#999" rx="6"/>
<text x="255" y="140" font-size="11" fill="#333">Small-cell suppression</text>
<text x="255" y="170" font-size="10" fill="#555">PMJAY cases this ward: —</text>
<text x="255" y="190" font-size="9" fill="#aaa">(cell &lt; 5 records, suppressed</text>
<text x="255" y="204" font-size="9" fill="#aaa">per DPDP re-identification risk)</text>
<text x="20" y="290" font-size="11" fill="#555">Toggling to "Identified" is only available to permission_level = full,</text>
<text x="20" y="308" font-size="11" fill="#555">and is itself logged to audit_log as a separate FR-14 event.</text>
</svg>
